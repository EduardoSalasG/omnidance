# omnidance API - vhost nginx (change api-edge-hardening).
#
# Artefacto de REPO: la instalación es manual del owner en la VM
# (security-hardening-owner-tasks item 4):
#   cp deploy/nginx/omnidance-api.conf /etc/nginx/sites-available/
#   ln -s ../sites-available/omnidance-api.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Contenido: proxy al proceso NestJS en loopback, límites L7 propios
# (complemento del ThrottlerModule de la app, no reemplazo), cap de body,
# timeouts anti-slowloris y la cadena de IP real para que el throttler
# y los logs vean la IP del cliente y no la del proxy de adelante.

# ─── Zonas de límite (definir a nivel http en nginx.conf o en
# sites-enabled antes del server) ───────────────────────────────────
# API HTTP: ~10 req/s sostenido por IP con burst corto - muy por encima
# del uso real (polling del checkout ~30/min) y por debajo de un flood.
limit_req_zone $binary_remote_addr zone=omnidance_api:10m rate=10r/s;
# Conexiones concurrentes por IP - cubre slowloris/hold de sockets.
limit_conn_zone $binary_remote_addr zone=omnidance_conn:10m;

server {
    listen 443 ssl;
    server_name api.omnidance.tech api.omnidance.eduardosalasg.dev;

    # Certificados: los gestiona el owner (certbot existente en la VM).
    # ssl_certificate     /etc/letsencrypt/live/<dominio>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<dominio>/privkey.pem;

    # Uploads acotados por la app: import de planillas 2MB y comprobantes
    # ~4MB → 6m deja margen sin abrir el body a abuso.
    client_max_body_size 6m;

    # ─── IP real del cliente ─────────────────────────────────────────
    # Prioridad: x-nf-client-connection-ip (la ponen los hits que el
    # proxy/rewrite de Netlify reenvía a la VM) > cf-connecting-ip
    # (cuando la zona quede proxied por Cloudflare, item 2 del doc de
    # owner) > la conexión directa.
    #
    # DECISIÓN DE SPOOFING (documentada): un hit DIRECTO a la VM puede
    # mandar x-nf-client-connection-ip inventado y "ganar" la prioridad
    # - rate-limit y logs quedarían atribuidos a una IP falsa. Aceptado
    # por ahora: un atacante que se auto-atribuye una IP arbitraria no
    # gana nada (el límite le aplica igual por bucket, y el spoofeo
    # masivo solo mueve el costo a sus propias buckets); la validación
    # real del header llega con Cloudflare/WAF - entonces reordenar a
    # cf-connecting-ip primero y/o validar x-nf solo en hits que vengan
    # de los rangos de Netlify.
    set $realip $remote_addr;
    if ($http_cf_connecting_ip != "") {
        set $realip $http_cf_connecting_ip;
    }
    if ($http_x_nf_client_connection_ip != "") {
        set $realip $http_x_nf_client_connection_ip;
    }

    # Timeouts: la app responde rápido; 30s de lectura cubre los exports
    # PDF más pesados. connect/send cortos frenan el hold de recursos.
    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    30s;
    send_timeout          15s;

    # WebSocket de notificaciones (socket.io): una conexión = un request
    # de larga vida - el limit_req no aplica (mataría el upgrade), sí el
    # cap de conexiones concurrentes (más laxo: varias pestañas por IP
    # son legítimas - NAT de un local lleno de bailarines).
    location /socket.io/ {
        limit_conn omnidance_conn 60;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $realip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=omnidance_api burst=30 nodelay;
        limit_conn omnidance_conn 40;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $realip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
