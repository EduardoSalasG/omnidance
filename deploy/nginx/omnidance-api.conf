# omnidance API - vhost nginx (change api-edge-hardening).
#
# INSTALADO en la VM como /etc/nginx/sites-available/api.omnidance.eduardosalasg.dev
# (sites-enabled es symlink). Reinstalación:
#   cp deploy/nginx/omnidance-api.conf /etc/nginx/sites-available/api.omnidance.eduardosalasg.dev
#   nginx -t && systemctl reload nginx
#
# Contenido: proxy al proceso NestJS en loopback, límites L7 propios
# (complemento del ThrottlerModule de la app, no reemplazo), cap de body,
# timeouts anti-slowloris y la cadena de IP real para que el throttler
# y los logs vean la IP del cliente y no la del proxy de adelante.

# ─── Zonas de límite (nivel http: sites-enabled se incluye desde el
# bloque http de nginx.conf, así que basta definirlas arriba) ────────
# La llave es $realip (la IP del cliente resuelta por la cadena
# x-nf > cf-connecting-ip > conexión directa definida abajo con map).
# Si se usara $binary_remote_addr el bucket sería la IP del edge de
# Cloudflare y TODOS los usuarios compartirían el mismo límite.
map $http_x_nf_client_connection_ip $omni_pre_ip {
    default $remote_addr;
    ~.+ $http_x_nf_client_connection_ip;
}
map $http_cf_connecting_ip $realip {
    default $omni_pre_ip;
    ~.+ $http_cf_connecting_ip;
}
# API HTTP: ~10 req/s sostenido por IP con burst corto - muy por encima
# del uso real (polling del checkout ~30/min) y por debajo de un flood.
limit_req_zone $realip zone=omnidance_api:10m rate=10r/s;
# Conexiones concurrentes por IP - cubre slowloris/hold de sockets.
limit_conn_zone $realip zone=omnidance_conn:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.omnidance.tech api.omnidance.eduardosalasg.dev;

    ssl_certificate /etc/letsencrypt/live/api.omnidance.eduardosalasg.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.omnidance.eduardosalasg.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads acotados por la app: import de planillas 2MB y comprobantes
    # ~4MB → 6m deja margen sin abrir el body a abuso.
    client_max_body_size 6m;

    # ─── IP real del cliente ─────────────────────────────────────────
    # Prioridad (map de arriba): x-nf-client-connection-ip (la ponen
    # los hits del rewrite de Netlify: usuario → Netlify → CF → VM) >
    # cf-connecting-ip (hits directos al host proxied) > conexión
    # directa al host legado o por IP.
    #
    # DECISIÓN DE SPOOFING (documentada): un hit que bypassa CF y pega
    # directo a la VM puede mandar x-nf-client-connection-ip inventado
    # y "ganar" la prioridad - el rate-limit quedaría atribuido a una
    # IP falsa. Aceptado: un atacante que se auto-atribuye una IP
    # arbitraria no gana nada (el límite le aplica igual por bucket).
    # Endurecimiento adicional posible: restringir 80/443 en el
    # firewall de Oracle a los rangos IP de Cloudflare (cierra el
    # bypass directo por IP/host legado).

    # Timeouts: la app responde rápido; 30s de lectura cubre los exports
    # PDF más pesados. connect/send cortos frenan el hold de recursos.
    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    30s;
    send_timeout          15s;

    # WebSocket de notificaciones (socket.io): una conexión = un request
    # de larga vida - el limit_req no aplica (mataría el upgrade), sí el
    # cap de conexiones concurrentes (más laxo: varias pestañas por IP
    # son legítimas - NAT de un local lleno de bailarines).
    location /socket.io/ {
        limit_conn omnidance_conn 60;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $realip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=omnidance_api burst=30 nodelay;
        limit_conn omnidance_conn 40;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $realip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP: redirect a https para ambos nombres (CF fuerza https igualmente;
# el host legado conserva el comportamiento anterior).
server {
    listen 80;
    listen [::]:80;
    server_name api.omnidance.eduardosalasg.dev api.omnidance.tech;

    if ($host = api.omnidance.eduardosalasg.dev) {
        return 301 https://$host$request_uri;
    }
    if ($host = api.omnidance.tech) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
