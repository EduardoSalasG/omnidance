# Frontend Next.js → Netlify. El runtime de Next (@netlify/plugin-nextjs)
# se aplica automáticamente al detectar apps/web/.next; se declara
# explícito porque la raíz es un monorepo pnpm.
[build]
  # shared compila primero: la web importa @omnidance/shared (dist).
  command = "pnpm --filter @omnidance/shared build && pnpm --filter @omnidance/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.12.1"
  # Rewrite same-origin: /api/* y /socket.io/* se proxean al API
  # (cookies Lax sin cross-site; socket.io queda en polling).
  API_PROXY_TARGET = "https://api.omnidance.eduardosalasg.dev"
  # NEXT_PUBLIC_* se inlinea en el bundle durante `next build` - sí llega
  # desde build.environment (a diferencia del runtime serverless). Es la
  # base de canonical/og:url/sitemap/robots/JSON-LD; sin ella salían
  # como localhost:3000 y WhatsApp compartía esa URL.
  NEXT_PUBLIC_WEB_URL = "https://omnidance.netlify.app"

# socket.io va por proxy edge directo al API, antes del runtime Next:
# el edge normaliza trailing slash (`/socket.io/` → 308 → `/socket.io`)
# y el path sin barra no matchea engine.io → Nest devolvía 404 y el
# cliente quedaba en loop de polling. El proxy preserva el path tal cual.
[[redirects]]
  from = "/socket.io/*"
  to = "https://api.omnidance.eduardosalasg.dev/socket.io/:splat"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Env vars restantes (Netlify UI → Site settings → Environment variables):
#   NEXT_PUBLIC_CARTO_BASEMAP_KEY- key pública del basemap (mapa academias).
#   NEXT_PUBLIC_VAPID_PUBLIC_KEY - key pública web-push.
#   NEXT_PUBLIC_API_URL          - dejar VACÍA (relativa = same-origin).
#   NEXT_PUBLIC_WEB_URL          - ya va en build.environment de arriba;
#     setearla en el UI solo si el dominio primario cambia.
