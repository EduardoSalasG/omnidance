name: QA

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Capa estática + unit del monorepo: corre en todo push/PR a dev y main.
# El e2e de browser (Playwright) va aparte por costo - ver test:e2e.
jobs:
  static-unit:
    runs-on: ubuntu-latest
    # Los e2e de API (test/*.e2e.spec.ts) levantan AppModule completo:
    # necesitan Postgres+Redis reales, schema pusheado y el baseline del
    # seed (catálogo de roles es FK de PersonRole).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnidance
          POSTGRES_PASSWORD: omnidance
          POSTGRES_DB: omnidance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnidance"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://omnidance:omnidance@localhost:5432/omnidance
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-secret
      QR_SECRET: ci-qr-secret
      SEED_ENV: prod
      SEED_ADMIN_EMAIL: admin@ci.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @omnidance/shared build
      # pnpm no corre postinstalls de deps: sin generate, @prisma/client
      # resuelve al stub sin tipos y el typecheck estalla en implicit-any.
      - name: Generate Prisma client
        run: pnpm --filter @omnidance/api exec prisma generate
      - name: Push schema + baseline seed
        run: |
          pnpm --filter @omnidance/api exec prisma db push
          pnpm db:seed
      - name: Typecheck (all workspaces)
        run: pnpm -r run typecheck
      - name: Lint (web)
        run: pnpm --filter @omnidance/web lint
      - name: Unit tests (all workspaces)
        run: pnpm -r run test
