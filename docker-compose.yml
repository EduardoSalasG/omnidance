services:
  db:
    image: postgres:16-alpine
    container_name: omnidance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnidance
      POSTGRES_PASSWORD: omnidance
      POSTGRES_DB: omnidance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnidance -d omnidance"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: omnidance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
